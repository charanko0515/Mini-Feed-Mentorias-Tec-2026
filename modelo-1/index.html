<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ALTERE: texto que aparece na aba do navegador -->
    <title>Mini Feed</title>
    <!-- Esta linha conecta o HTML ao arquivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO: título e menu de navegação -->
    <header>
        <div class="header-content">
            <!-- ALTERE: nome da sua rede social -->
            <h1>Mini Feed</h1>
            <nav>
                <a href="#">Inicio</a>
                <a href="#">Perfil</a>
            </nav>
        </div>
    </header>

    <main>

        <!-- NOVA PUBLICAÇÃO: área do usuário logado -->
        <section class="new-post">
            <div class="user">
                <!-- ALTERE: a letra do avatar e o seu nome -->
                <div class="avatar">S</div>
                <div>
                    <strong>Seu Nome</strong>
                    <span>O que você está pensando?</span>
                </div>
            </div>
            <button>Publicar</button>
        </section>

        <!-- POSTAGEM: cada <article> é uma publicação do feed -->
        <article class="post">
            <div class="post-header">
                <div class="avatar">M</div>
                <div>
                    <strong>Maria</strong>
                    <span>Há 10 minutos</span>
                </div>
            </div>

            <!-- ALTERE: o texto da postagem -->
            <p class="post-text">Escreva aqui o texto da sua postagem.</p>

            <!--
                ALTERE: para usar a sua imagem,
                1. coloque o arquivo na pasta "imagens"
                2. troque o src pelo nome do arquivo
                3. descreva a imagem no alt
            -->
            <img src="imagens/exemplo.svg" alt="Ilustração de exemplo com montanhas e um sol">

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </article>

        <!-- Para criar outra postagem, copie um <article> inteiro e cole aqui -->
        <article class="post">
            <div class="post-header">
                <div class="avatar">P</div>
                <div>
                    <strong>Pedro</strong>
                    <span>Há 1 hora</span>
                </div>
            </div>

            <p class="post-text">Mais uma postagem de exemplo para ver o feed com vários cards.</p>

            <img src="imagens/exemplo.svg" alt="Ilustração de exemplo com montanhas e um sol">

            <div class="post-actions">
                <button>Curtir</button>
                <button>Comentar</button>
            </div>
        </article>

    </main>

    <!-- RODAPÉ: ALTERE com o nome do seu projeto -->
    <footer>
        <p>Mini Feed - Todos os direitos reservados</p>
    </footer>

</body>
</html>
